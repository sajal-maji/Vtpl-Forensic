<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reset Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      height: 100vh;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .container {
      background: #111;
      padding: 40px;
      border-radius: 12px;
      width: 100%;
      max-width: 350px;
      box-shadow: 0 0 20px rgba(255,255,255,0.1);
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
      font-size: 22px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 15px 0;
      border-radius: 8px;
      border: none;
      outline: none;
      background: #222;
      color: #fff;
      font-size: 14px;
    }

    input::placeholder {
      color: #aaa;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #ddd;
    }

    .success {
      margin-top: 15px;
      color: #4caf50;
      font-size: 14px;
    }

    .error {
      margin-top: 15px;
      color: #f44336;
      font-size: 14px;
    }
  </style>

</head>

<body>

  <div class="container">
    <h2>Reset Password</h2>

<form id="resetForm">
  <input type="password" id="password" placeholder="Enter new password" required />
  <button type="submit">Reset Password</button>
</form>

<div id="message"></div>


  </div>

  <script>
    const token = window.location.pathname.split("/").pop();

    document.getElementById("resetForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const password = document.getElementById("password").value;
      const messageDiv = document.getElementById("message");

      const res = await fetch(`/api/v1/auth/reset-password/${token}`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ password })
      });

      const data = await res.json();

      if (res.ok) {
        messageDiv.innerHTML = '<div class="success">Password reset successful</div>';

        setTimeout(() => {
          window.location.href = "http://forensic-dev.videonetics.com:5004/";
        }, 1500);

      } else {
        messageDiv.innerHTML = `<div class="error">${data.message}</div>`;
      }
    });
  </script>

</body>
</html>
